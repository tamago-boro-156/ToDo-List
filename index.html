<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f4f8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="やることノート">
<title>やることノート</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a daily page in a 藍 (indigo) notebook — week strip on top, one day's list, then a one-line diary note */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --fg: #1c2433;
  --muted: #6b7486;
  --line: #dde2ea;
  --accent: #2f4f8f;
  --accent-soft: #e3e9f5;
  --sun: #b4441f;
  --sat: #2f6f9f;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161e; --surface: #1a202b; --fg: #e4e8f0; --muted: #8e97a8;
    --line: #2a3242; --accent: #8fa9e0; --accent-soft: #232d42; --sun: #ec8a66; --sat: #7fb6e0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161e; --surface: #1a202b; --fg: #e4e8f0; --muted: #8e97a8;
  --line: #2a3242; --accent: #8fa9e0; --accent-soft: #232d42; --sun: #ec8a66; --sat: #7fb6e0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 64px;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
input, button, textarea { font: inherit; color: inherit; }
input:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.app-name { font-family: var(--font-display); font-size: .95rem; color: var(--muted); margin: 0; letter-spacing: .06em; }

/* week strip */
.week { display: grid; grid-template-columns: auto repeat(7, 1fr) auto; gap: 4px; align-items: stretch; }
.nav {
  border: 0; background: transparent; color: var(--muted); cursor: pointer;
  border-radius: 8px; padding: 0 6px; font-size: 1.1rem;
}
.nav:hover { background: var(--accent-soft); color: var(--fg); }
.day {
  border: 1px solid transparent; background: transparent; border-radius: 10px; cursor: pointer;
  padding: 6px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0;
}
.day:hover { background: var(--accent-soft); }
.day .wd { font-size: .7rem; color: var(--muted); }
.day .dn { font-family: var(--font-mono); font-size: .95rem; font-variant-numeric: tabular-nums; }
.day.sun .wd { color: var(--sun); }
.day.sat .wd { color: var(--sat); }
.day.today .dn { color: var(--accent); font-weight: 700; }
.day[aria-current="date"] { background: var(--surface); border-color: var(--line); }
.meter { width: 22px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.meter.none { background: transparent; }

/* day heading */
.dayhead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-size: 1.8rem; margin: 0; text-wrap: balance; }
h1 small { font-size: .95rem; color: var(--muted); margin-left: 8px; font-family: var(--font-body); font-weight: 500; }
.right { display: flex; align-items: center; gap: 12px; }
.count { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 2px 12px; font-size: .82rem; cursor: pointer; color: var(--accent);
}

form.add { display: flex; gap: 8px; }
.add input { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.btn-primary {
  background: var(--accent); color: var(--surface); border: 0; border-radius: 8px;
  padding: 10px 18px; font-weight: 700; cursor: pointer; flex: none;
}
.btn-primary:hover { filter: brightness(1.08); }

.carry {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-size: .88rem;
}
.carry button { border: 0; background: var(--surface); color: var(--accent); border-radius: 6px; padding: 4px 12px; cursor: pointer; font-weight: 700; }

ul.list {
  list-style: none; margin: 0; padding: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
}
.item {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
  padding: 12px 14px; border-top: 1px solid var(--line);
}
.item:first-child { border-top: 0; }
.check {
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted);
  background: transparent; cursor: pointer; padding: 0; display: grid; place-items: center;
}
.check svg { width: 12px; height: 12px; opacity: 0; }
.done .check { background: var(--accent); border-color: var(--accent); }
.done .check svg { opacity: 1; }
.body { min-width: 0; display: flex; align-items: center; gap: 8px; }
.text { overflow-wrap: anywhere; cursor: text; min-width: 0; }
.done .text { color: var(--muted); text-decoration: line-through; }
.tag { flex: none; font-size: .7rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.edit-input { width: 100%; padding: 4px 8px; background: var(--surface); border: 1px solid var(--accent); border-radius: 6px; }
.del {
  border: 0; background: transparent; color: var(--muted); cursor: pointer;
  width: 32px; height: 32px; border-radius: 6px; font-size: 1.1rem; opacity: .5;
}
.item:hover .del, .del:focus-visible { opacity: 1; }
.del:hover { background: var(--accent-soft); color: var(--sun); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

.note { display: flex; flex-direction: column; gap: 6px; }
.note label { font-size: .78rem; color: var(--muted); letter-spacing: .06em; }
.note textarea {
  resize: vertical; min-height: 72px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; line-height: 1.7;
  background-image: repeating-linear-gradient(transparent 0 calc(1.7em - 1px), var(--line) calc(1.7em - 1px) 1.7em);
  background-position: 0 10px; background-attachment: local;
}
.foot { font-size: .78rem; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .item { animation: in .18s ease-out; }
  @keyframes in { from { transform: translateY(-3px); opacity: .4; } to { transform: none; opacity: 1; } }
}
@media (max-width: 420px) { .day .dn { font-size: .85rem; } .nav { padding: 0 2px; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <p class="app-name">やることノート</p>
  </div>

  <div class="week" id="week" aria-label="日付を選ぶ"></div>

  <div class="dayhead">
    <h1 id="dayTitle"></h1>
    <div class="right">
      <span class="count" id="count"></span>
      <button type="button" class="chip" id="toToday" hidden>今日へ</button>
    </div>
  </div>

  <form class="add" id="addForm">
    <input type="text" id="newText" placeholder="今日やることを書いて Enter" autocomplete="off" aria-label="やること">
    <button class="btn-primary" type="submit">追加</button>
  </form>

  <div class="carry" id="carry" hidden>
    <span id="carryText"></span>
    <button type="button" id="carryBtn">引き継ぐ</button>
  </div>

  <ul class="list" id="list"></ul>

  <div class="note">
    <label for="memo">ひとことメモ</label>
    <textarea id="memo" placeholder="今日のふりかえり、気づいたことなど"></textarea>
  </div>

  <p class="foot">テキストをダブルクリックで編集できます。データはこのブラウザの中に保存されます。</p>
</div>

<script>
(() => {
  const KEY = 'todo-daily-v1';
  const pad = n => String(n).padStart(2, '0');
  const key = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const shift = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return key(d); };
  const TODAY = key(new Date());
  const WD = ['日', '月', '火', '水', '木', '金', '土'];

  const sample = () => ({
    days: {
      [shift(TODAY, -2)]: { items: [
        { id: 1, text: '部屋の掃除', done: true, ex: true },
        { id: 2, text: '本を30ページ読む', done: true, ex: true }] },
      [shift(TODAY, -1)]: { items: [
        { id: 3, text: '週次レポートを書く', done: true, ex: true },
        { id: 4, text: '歯医者の予約を入れる', done: false, ex: true },
        { id: 5, text: 'ジムに行く', done: true, ex: true }] },
      [TODAY]: { items: [
        { id: 6, text: '牛乳と卵を買う', done: false, ex: true },
        { id: 7, text: '企画書の見直し', done: true, ex: true },
        { id: 8, text: '30分ストレッチ', done: false, ex: true }], memo: '' },
    }
  });

  let data = null;
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s.days === 'object') data = s; } catch {}
  if (!data) data = sample();
  let cur = TODAY;
  let editing = null;

  const $ = id => document.getElementById(id);
  const day = k => (data.days[k] ||= { items: [], memo: '' });
  const peek = k => data.days[k] || { items: [], memo: '' };
  const prune = k => { const d = data.days[k]; if (d && !d.items.length && !d.memo) delete data.days[k]; };
  const saveLocal = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} };

  const save = () => saveLocal();
  function endEdit() { editing = null; render(); }
  function go(k) { prune(cur); save(cur); cur = k; editing = null; render(); }

  function renderWeek() {
    const d = parse(cur);
    const monday = shift(cur, -((d.getDay() + 6) % 7));
    const w = $('week');
    w.replaceChildren();
    const prev = document.createElement('button');
    prev.type = 'button'; prev.className = 'nav'; prev.textContent = '‹'; prev.setAttribute('aria-label', '前の週');
    prev.onclick = () => go(shift(cur, -7));
    w.append(prev);
    for (let i = 0; i < 7; i++) {
      const k = shift(monday, i);
      const dt = parse(k);
      const items = peek(k).items;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'day' + (dt.getDay() === 0 ? ' sun' : dt.getDay() === 6 ? ' sat' : '') + (k === TODAY ? ' today' : '');
      if (k === cur) b.setAttribute('aria-current', 'date');
      b.setAttribute('aria-label', `${dt.getMonth() + 1}月${dt.getDate()}日 ${items.filter(x => x.done).length}/${items.length}件完了`);
      const ratio = items.length ? items.filter(x => x.done).length / items.length : 0;
      b.innerHTML = `<span class="wd">${WD[dt.getDay()]}</span><span class="dn">${dt.getDate()}</span>` +
        `<span class="meter${items.length ? '' : ' none'}"><i style="width:${Math.round(ratio * 100)}%"></i></span>`;
      b.onclick = () => go(k);
      w.append(b);
    }
    const next = document.createElement('button');
    next.type = 'button'; next.className = 'nav'; next.textContent = '›'; next.setAttribute('aria-label', '次の週');
    next.onclick = () => go(shift(cur, 7));
    w.append(next);
  }

  function render() {
    const dt = parse(cur);
    const rel = cur === TODAY ? '今日' : cur === shift(TODAY, -1) ? '昨日' : cur === shift(TODAY, 1) ? '明日' : '';
    $('dayTitle').innerHTML = `${dt.getMonth() + 1}月${dt.getDate()}日（${WD[dt.getDay()]}）` + (rel ? `<small>${rel}</small>` : '');
    $('toToday').hidden = cur === TODAY;
    $('newText').placeholder = cur === TODAY ? '今日やることを書いて Enter' : cur > TODAY ? 'この日にやることを書いて Enter' : 'この日にやったことを書いて Enter';
    renderWeek();

    const d = peek(cur);
    // carry over unfinished items from the previous day
    const prevKey = shift(cur, -1);
    const left = peek(prevKey).items.filter(x => !x.done && !d.items.some(y => y.text === x.text));
    $('carry').hidden = !(left.length && cur >= TODAY);
    $('carryText').textContent = `前日にやり残したことが ${left.length} 件あります`;
    $('carryBtn').onclick = () => {
      const t = day(cur);
      left.forEach((x, i) => t.items.push({ id: Date.now() + i, text: x.text, done: false, from: prevKey }));
      save(); render();
    };

    const list = $('list');
    list.replaceChildren();
    if (!d.items.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = cur === TODAY ? 'まだ何もありません。今日やることを上の欄に書いてみましょう' : 'この日の記録はありません';
      list.append(li);
    }
    for (const x of d.items) {
      const li = document.createElement('li');
      li.className = 'item' + (x.done ? ' done' : '');

      const chk = document.createElement('button');
      chk.type = 'button'; chk.className = 'check';
      chk.setAttribute('aria-label', x.done ? '未完了に戻す' : '完了にする');
      chk.innerHTML = '<svg viewBox="0 0 12 12"><path d="M2 6.5l2.5 2.5L10 3.5" fill="none" stroke="var(--surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      chk.onclick = () => { x.done = !x.done; save(); render(); };

      const body = document.createElement('div');
      body.className = 'body';
      if (editing === x.id) {
        const inp = document.createElement('input');
        inp.type = 'text'; inp.className = 'edit-input'; inp.id = 'edit-' + x.id; inp.value = x.text;
        let closed = false;
        const commit = () => { if (closed) return; closed = true; const v = inp.value.trim(); if (v && v !== x.text) { x.text = v; save(); } endEdit(); };
        inp.onkeydown = e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') { closed = true; endEdit(); } };
        inp.onblur = commit;
        body.append(inp);
        setTimeout(() => { inp.focus(); inp.select(); });
      } else {
        const sp = document.createElement('span');
        sp.className = 'text'; sp.textContent = x.text;
        sp.ondblclick = () => { editing = x.id; render(); };
        body.append(sp);
        if (x.from) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = '前日から'; body.append(t); }
        if (x.ex) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = '例'; body.append(t); }
      }

      const del = document.createElement('button');
      del.type = 'button'; del.className = 'del'; del.textContent = '×';
      del.setAttribute('aria-label', '削除');
      del.onclick = () => { day(cur).items = d.items.filter(y => y !== x); prune(cur); save(); render(); };

      li.append(chk, body, del);
      list.append(li);
    }
    const doneN = d.items.filter(x => x.done).length;
    $('count').textContent = d.items.length ? `${doneN} / ${d.items.length} 完了` : '';
    const memo = $('memo');
    if (document.activeElement !== memo) memo.value = d.memo || '';
  }

  $('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const text = $('newText').value.trim();
    if (!text) { $('newText').focus(); return; }
    day(cur).items.push({ id: Date.now(), text, done: false });
    $('newText').value = '';
    save(); render();
    $('newText').focus();
  });
  $('memo').addEventListener('input', e => { day(cur).memo = e.target.value; save(cur, 800); });
  $('memo').addEventListener('blur', () => { prune(cur); save(cur); renderWeek(); });
  $('toToday').onclick = () => go(TODAY);

  render();
})();
</script>
</body>
</html>
